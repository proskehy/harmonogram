# This is a basic workflow that is manually triggered

name: Update harmonogram.json

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  run-scraper:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Permissions required to commit changes and open a Pull Request
    permissions:
      contents: write
      pull-requests: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '25' # Uses Node.js 20 LTS (or specify your preferred version)
        cache: 'npm'       # Caches npm dependencies to make future runs much faster

    # 3. Install dependencies from package-lock.json
    - name: Install dependencies
      run: npm ci

    # 4. Run your Node.js scraper script
    - name: Run Scraper
      run: node scraper.js

    # 5. Create a Pull Request ONLY if harmonogram.json was changed
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update harmonogram.json"
        title: "Automated Harmonogram Update"
        body: "This PR was automatically generated by GitHub Actions after running scraper.js."
        branch: "scraper-updates"
        # This line ensures a PR is only created if this specific file changed
        add-paths: |
          harmonogram.json
